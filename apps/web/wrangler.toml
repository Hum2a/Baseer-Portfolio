name = "baseer-portfolio"
main = "src/worker.ts"
account_id = "953a4a7dca82bf090ec89eedeb87a064"
compatibility_date = "2026-07-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "baseer-portfolio-staging"
preview_bucket_name = "baseer-portfolio-staging"

[vars]
APP_URL = "http://localhost:8787"
OWNER_ID = "seed-user-baseer"
# DATABASE_URL lives in .dev.vars / wrangler secrets.
# Prefer Hyperdrive in staging/production:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_LOCAL_OR_DEV_HYPERDRIVE_ID"

[env.staging]
name = "baseer-portfolio-staging"
workers_dev = false

[env.staging.vars]
APP_URL = "https://staging.baseer.co.uk"
OWNER_ID = "seed-user-baseer"

[[env.staging.routes]]
pattern = "staging.baseer.co.uk"
custom_domain = true

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "baseer-portfolio-staging"

# [[env.staging.hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_STAGING_HYPERDRIVE_ID"

[env.production]
name = "baseer-portfolio"
workers_dev = false

[env.production.vars]
APP_URL = "https://baseer.co.uk"
OWNER_ID = "seed-user-baseer"

[[env.production.routes]]
pattern = "baseer.co.uk"
custom_domain = true

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "baseer-portfolio"

# [[env.production.hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_PRODUCTION_HYPERDRIVE_ID"
